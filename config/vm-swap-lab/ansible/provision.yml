---
# Ubuntu-lab experiment. This is the original capacity experiment and it is left
# exactly as it was: Ubuntu 24.04 guest, apt, no recompression.
#
# Fedora is NOT used here on purpose. The Fedora guest exists for one reason
# only — its kernel has CONFIG_ZRAM_MULTI_COMP, which Ubuntu disables — and that
# is needed solely by the two-layer recompression experiment, which has its own
# playbook: provision-fedora.yml.
#
# Usage:
#   ansible-playbook provision.yml                    # all arms, sequential
#   ansible-playbook provision.yml -e arm_name=zram-2to1
#   ansible-playbook provision.yml -e keep_vm=true    # leave the last VM up
#   ../arms-report.sh                                 # latency/capacity table
#
# Ansible is assumed present; nothing here installs it.
- name: session capacity arms (ubuntu)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    lab_dir: "{{ playbook_dir }}/.."
    # One results tree per experiment: the housekeeping step prunes arm
    # directories the current play does not run, so a shared results/ would let
    # one experiment delete the other's reports.
    results_dir: "{{ lab_dir }}/results-{{ guest }}"
    # The guest image and its default user. Ubuntu Cloud's user is `ubuntu`, in
    # the `sudo` group; Fedora's is `fedora`, in `wheel`. Every script reads these
    # from the environment, so the distro is a variable rather than a fork.
    guest: ubuntu
    guest_ssh_user: ubuntu
    guest_group: sudo
    vm_cpus: 4
    vm_mem_mb: 4096
    vm_disk_gb: 12
    ladder: "5 6 7"
    hold: 20s
    window: 60s
    sample_seconds: 2
    swap_per_pod: 67108864
    ready_timeout: 300
    # Hard cap on one rung. A failing rung otherwise waits out every claim timeout
    # and takes 28-33 minutes, so a 3x3 ladder of failures ran for hours.
    rung_timeout: 360
    repeats: 2
    recomp_when: before
    recomp_type: both
    sandbox_version: v1.0.7
    k3s_cache: true
    keep_vm: false
    arm_name: ""

    # No recompression arm here: Ubuntu cannot run one (CONFIG_ZRAM_MULTI_COMP is
    # off in every Ubuntu release checked), so these arms differ only in the
    # primary algorithm and in whether swap is allowed at all.
    arms:
      - name: none
        swap_mode: none
        class: swap-off
        zram_algo: lz4
        zram_mb: 512
        swap_mb: 512
        recomp_algo: ""
      - name: zram-2to1
        swap_mode: zram
        class: swap-on
        zram_algo: lz4
        zram_mb: 512
        swap_mb: 512
        recomp_algo: ""
      - name: zram-5to1
        swap_mode: zram
        class: swap-on
        zram_algo: zstd
        zram_mb: 512
        swap_mb: 512
        recomp_algo: ""

  tasks:
    - name: housekeeping and cached artifacts
      ansible.builtin.include_tasks: tasks/common-pre.yml

    - name: each arm
      ansible.builtin.include_tasks: tasks/arm.yml
      loop: "{{ arms }}"
      loop_control:
        loop_var: arm_cfg
      when: arm_name == "" or arm_name == arm_cfg.name

    - name: report
      ansible.builtin.include_tasks: tasks/common-post.yml
