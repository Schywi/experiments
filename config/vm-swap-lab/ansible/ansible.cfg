[defaults]
# The lab is entirely local: QEMU on this host, ssh over a forwarded port, and
# every task runs on localhost. An explicit inventory is still worth having —
# without one Ansible warns and falls back to implicit localhost, which does not
# match 'all' and silently skips plays that target groups.
inventory = inventory.ini
host_key_checking = False
deprecation_warnings = False
interpreter_python = auto_silent
retry_files_enabled = False
# Ansible's default local_tmp lives under $HOME, which is read-only in some
# shells (and always for CI). /tmp is writable everywhere this lab runs.
local_tmp = /tmp/ansible-local
# Same for the per-task remote tmp: the default (~/.ansible/tmp) fails to create
# on a host whose HOME is read-only, and Ansible reports it as UNREACHABLE.
remote_tmp = /tmp/.ansible-remote
# No stdout_callback here on purpose: `community.general.yaml` was removed in
# collection 12.0.0 and Ansible aborts before running anything if it is named.
# ansible.builtin.default is the only callback this lab needs.
