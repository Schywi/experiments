#cloud-config
# Disposable k3s node for the swap experiment (see README.md in this directory).
#
# The swap backing is a parameter, because it is the experiment's axis:
#   SWAP_MODE=none | zram | disk
#     zram  → /dev/zram0, ZRAM_MB, algorithm ZRAM_ALGO (lz4 ≈2:1, lzo-rle ≈2.5:1,
#             zstd ≈5:1 measured). Compression trades CPU for capacity, so the
#             ratio is a variable, not a setting.
#     disk  → swap file of SWAP_MB on the root disk: real capacity, ms latency,
#             no compression CPU.
# The three placeholders below are substituted by up.sh.
#
# Two facts decide the order:
#   1. swap must exist before k3s starts, so the kubelet meets a swap device on
#      its first boot instead of discovering one later.
#   2. `memorySwap` is a KubeletConfiguration field with no kubelet flag, so it
#      arrives as a drop-in file. k3s merges
#      /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/*.conf into the config it
#      generates. `verify-swap.sh` proves the drop-in was picked up by reading
#      the node's /configz; it does not trust this file having been written.

# Fedora, not Ubuntu: CONFIG_ZRAM_MULTI_COMP is opt-in per distro and Ubuntu
# ships it OFF (measured: noble 6.8 and plucky 6.14 kernel annotations both say
# 'amd64': 'n'), so no recompression pass can ever run there. Fedora 44's kernel
# is built with it (=y, checked in /boot/config on the host) and exposes
# recomp_algorithm / recompress / idle on /sys/block/zram0/.
# Filled in by up.sh from GUEST: ubuntu→(ubuntu, sudo), fedora→(fedora, wheel).
# The group matters: cloud-init fails to create the user if the group does not
# exist on that distro, and then no SSH key lands and the guest never answers.
users:
  - name: __GUEST_USER__
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    groups: [__GUEST_GROUP__]
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__

ssh_pwauth: false
disable_root: true

package_update: true
# No zram generator package on purpose. Installing it gave the guest TWO owners of
# /dev/zram0: the distro's systemd-zram-setup@zram0.service created a 3.8 GiB
# device from its default policy, and setup-swap.sh then failed trying to reset it,
# so the arm measured a device 30x larger than configured with no secondary
# algorithm. setup-swap.sh is the only owner now.
packages:
  - curl
  - util-linux

write_files:
  # Fedora does not load these at boot; k3s needs both (overlayfs for the snapshotter,
  # br_netfilter so bridged pod traffic is seen by iptables/nftables).
  - path: /etc/modules-load.d/k3s.conf
    permissions: "0644"
    content: |
      overlay
      br_netfilter
  - path: /etc/sysctl.d/90-k3s.conf
    permissions: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
  - path: /usr/local/bin/setup-swap.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # Configure the swap backing this VM was booted for. Deliberately explicit:
      # the size is a fixed number of MiB, not ram/2. A large zram removes RAM
      # from the pods it is supposed to help — 1.5 GiB of zram on a 3 GiB node
      # made the node worse.
      set -e
      # Record every step as it happens. Two runs were lost to a script that died
      # without leaving any trace, so silence is treated as a bug: the last line in
      # /var/tmp/swap-mode is by definition the step that failed.
      logf=/var/tmp/swap-mode
      say() { echo "$*" >>"${logf}" 2>/dev/null || echo "$*"; }
      trap 'rc=$?; [ "$rc" -eq 0 ] || echo "FAILED (rc=$rc) at the step above" >>"${logf}" 2>/dev/null || true' EXIT
      : >"${logf}" 2>/dev/null || logf=/dev/kmsg
      say "start mode=__SWAP_MODE__ zram=__ZRAM_MB__M algo=__ZRAM_ALGO__ secondary=__ZRAM_SECONDARY__"
      mode="__SWAP_MODE__"
      zram_mb="__ZRAM_MB__"
      zram_algo="__ZRAM_ALGO__"
      zram_secondary="__ZRAM_SECONDARY__"
      swap_mb="__SWAP_MB__"

      case "${mode}" in
        zram)
          # Drive the device directly instead of through systemd-zram-generator.
          # The generator's unit races the module load at boot and its second
          # start fails with "Failed to configure disk size into
          # /sys/block/zram0/disksize: Cannot allocate memory" — observed on a
          # fresh 3 GiB VM. Three explicit steps have no such ordering problem.
          # Distro-agnostic on purpose. Fedora carries zram in
          # kernel-modules-core (already installed); Debian/Ubuntu keep it in
          # linux-modules-extra. Hardcoding either one breaks the other: assuming
          # Fedora while the cached base image was still Ubuntu left this guest
          # with NO swap at all, and the swap-on arm then ran 21 sessions against
          # a node with 22 MiB available and no device.
          say "zram: modprobe"
          if ! modprobe zram 2>/dev/null; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq || true
              apt-get install -y --no-install-recommends \
                "linux-modules-extra-$(uname -r)" || true
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y "kernel-modules-extra-$(uname -r)" || true
            fi
            modprobe zram 2>/dev/null || { echo "cannot load the zram module" >&2; exit 1; }
          fi
          # Stop anything else owning the device (a distro zram generator, or a
          # device left from a previous boot), then start from a clean one.
          systemctl stop "systemd-zram-setup@zram0.service" 2>/dev/null || true
          systemctl mask "systemd-zram-setup@zram0.service" 2>/dev/null || true
          if [ -e /sys/block/zram0/disksize ] && [ "$(cat /sys/block/zram0/disksize)" != "0" ]; then
            swapoff /dev/zram0 2>/dev/null || true
            echo 1 >/sys/block/zram0/reset || true
          fi
          # The secondary algorithm MUST be chosen before disksize is set. The
          # kernel rejects a change once the device is initialised (EBUSY), and
          # writing disksize is what initialises it — measured on the Fedora guest
          # as "recomp_algorithm write refused (have: )" for every rung that tried
          # it from the harness instead of here.
          if [ -n "${zram_secondary}" ]; then
            # The sysfs ABI is key=value, not a bare name. zram_drv.c's
            # recomp_algorithm_store() parses `next_arg()` and returns -EINVAL for
            # any token without a value, so `echo zstd > recomp_algorithm` fails on
            # every kernel that has this ABI — measured on Fedora 44 as "write
            # refused" with the device still uninitialised (disksize=0), which is
            # what ruled out the EBUSY theory. Correct form, from
            # Documentation/admin-guide/blockdev/zram.rst:
            #   echo "algo=zstd priority=1" > /sys/block/zram0/recomp_algorithm
            # The bare-name fallback stays for kernels before that ABI.
            say "secondary: before write, disksize=$(cat /sys/block/zram0/disksize 2>/dev/null) recomp_algorithm='$(cat /sys/block/zram0/recomp_algorithm 2>/dev/null)'"
            if [ ! -e /sys/block/zram0/recomp_algorithm ]; then
              say "secondary: SKIPPED, kernel has no recomp_algorithm"
            elif echo "algo=${zram_secondary} priority=1" >/sys/block/zram0/recomp_algorithm 2>/dev/null; then
              say "secondary: set via key=value to '$(cat /sys/block/zram0/recomp_algorithm)'"
            elif echo "${zram_secondary}" >/sys/block/zram0/recomp_algorithm 2>/dev/null; then
              say "secondary: set via bare name to '$(cat /sys/block/zram0/recomp_algorithm)'"
            else
              say "secondary: REFUSED both syntaxes (disksize=$(cat /sys/block/zram0/disksize), now '$(cat /sys/block/zram0/recomp_algorithm 2>/dev/null)'); continuing without it so the guest keeps its swap"
            fi
          fi
          say "zram: creating device size=${zram_mb}M algo=${zram_algo}"
          dev="$(zramctl --find --size "${zram_mb}M" --algorithm "${zram_algo}")"
          [ -n "${dev}" ] || { echo "zramctl could not create a device" >&2; exit 1; }
          mkswap "${dev}" >/dev/null
          swapon "${dev}"
          grep -q "${dev}" /proc/swaps || { say "swapon FAILED for ${dev}"; exit 1; }
          say "swap: zram ${zram_mb}M ${zram_algo} on ${dev} OK"
          ;;
        disk)
          rm -f /swapfile
          fallocate -l "${swap_mb}M" /swapfile 2>/dev/null || \
            dd if=/dev/zero of=/swapfile bs=1M count="${swap_mb}" status=none
          chmod 600 /swapfile
          mkswap /swapfile >/dev/null
          swapon /swapfile || { echo "swapon /swapfile failed" >&2; exit 1; }
          grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >>/etc/fstab
          say "swap: disk ${swap_mb}M (no zram) OK"
          ;;
        none)
          say "swap: none OK"
          ;;
        *)
          echo "unknown SWAP_MODE '${mode}'" >&2
          exit 1
          ;;
      esac
      cat /proc/swaps

  - path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/90-swap.conf
    permissions: "0644"
    content: |
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      failSwapOn: false
      memorySwap:
        swapBehavior: NoSwap

  - path: /usr/local/bin/install-k3s.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # Install k3s from the host's cache instead of the internet.
      #
      # The previous one-liner (`curl -sfL https://get.k3s.io | sh`) failed with
      # "Failed to connect to update.k3s.io port 443 after 224659 ms", leaving no
      # k3s, no node, and an up.sh timeout that read like a resource problem. Here
      # the binary and the airgap image bundle come from the host over QEMU's
      # user-net address (10.0.2.2), and INSTALL_K3S_SKIP_DOWNLOAD stops the
      # installer reaching out at all. An empty base falls back to the network so
      # the lab still works before `fetch-k3s.sh` has run once.
      set -e
      base="__K3S_BASE_URL__"

      if [ -n "${base}" ]; then
        echo "k3s artifacts from ${base}"
        curl -fsSL --retry 8 --retry-all-errors --connect-timeout 10 \
          -o /usr/local/bin/k3s "${base}/k3s"
        chmod 0755 /usr/local/bin/k3s
        mkdir -p /var/lib/rancher/k3s/agent/images
        curl -fsSL --retry 8 --retry-all-errors --connect-timeout 10 \
          -o /var/lib/rancher/k3s/agent/images/k3s-airgap-images-amd64.tar.zst \
          "${base}/k3s-airgap-images-amd64.tar.zst"
        # The workload image must be here too: airgapping k3s alone left the arms
        # in ErrImagePull, because pulling chrome-sandbox still needed egress.
        # Anything in this directory is imported by k3s at start-up.
        if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 \
             -o /var/lib/rancher/k3s/agent/images/chrome-sandbox.tar \
             "${base}/chrome-sandbox.tar"; then
          echo "workload image cached for import"
        else
          echo "warning: no chrome-sandbox.tar on the host; the pool will need egress" >&2
        fi
        curl -fsSL --retry 8 --retry-all-errors --connect-timeout 10 \
          -o /tmp/install-k3s.sh "${base}/install.sh"
        skip=true
      else
        echo "no artifact base given: downloading from the network (slow, may fail)"
        curl -fsSL --retry 8 --retry-all-errors -o /tmp/install-k3s.sh https://get.k3s.io
        skip=false
      fi
      chmod 0755 /tmp/install-k3s.sh

      INSTALL_K3S_SKIP_DOWNLOAD="${skip}" \
      INSTALL_K3S_CHANNEL=stable \
      # --selinux=false is explicit on purpose: leaving it to auto-detection makes
      # k3s enable SELinux labelling on a Fedora guest, which expects the
      # k3s-selinux rpm. That rpm cannot be fetched airgapped, so the lab turns the
      # integration off rather than half-enabling it.
      INSTALL_K3S_EXEC='--kubelet-arg=fail-swap-on=false --write-kubeconfig-mode=0644 --selinux=false' \
        /tmp/install-k3s.sh

      # Drop the browser bundle once containerd has it. Everything in
      # agent/images is re-imported on every k3s start, and 332 MB of re-import
      # made `systemctl restart k3s` outlast systemd's start window — the command
      # returned non-zero while k3s came up fine, which looked like a failure.
      if [ -f /var/lib/rancher/k3s/agent/images/chrome-sandbox.tar ]; then
        for _ in $(seq 1 60); do
          k3s kubectl get --raw /readyz >/dev/null 2>&1 && break
          sleep 5
        done
        rm -f /var/lib/rancher/k3s/agent/images/chrome-sandbox.tar
        echo "browser image imported; bundle removed from agent/images"
      fi

runcmd:
  # Fedora boots with SELinux enforcing and firewalld active; both get in the way
  # of an airgapped single-node k3s. The k3s installer tries to `dnf install
  # k3s-selinux` when it sees SELinux enforcing, which cannot work with no egress,
  # so permissive is set before the installer runs (it then skips the rpm).
  - [sh, -c, "sed -i 's/^SELINUX=.*/SELINUX=permissive/' /etc/selinux/config; setenforce 0 2>/dev/null || true"]
  - [sh, -c, "systemctl disable --now firewalld 2>/dev/null || true"]
  # modules-load.d/sysctl.d only take effect at boot; load them now for this boot.
  - [sh, -c, "modprobe overlay 2>/dev/null || true; modprobe br_netfilter 2>/dev/null || true; sysctl --system >/dev/null 2>&1 || true"]
  # swap first, so the kubelet starts with the device it is meant to use
  - [sh, /usr/local/bin/setup-swap.sh]
  - [sh, /usr/local/bin/install-k3s.sh]
  # Prove the guest can do recompression at all. Ubuntu could not, which silently
  # turned every zram-multi rung into a duplicate of zram-multi-ctl; the arm now
  # fails fast instead of measuring nothing for 35 minutes.
  - [sh, -c, "test -e /sys/block/zram0/recomp_algorithm || { echo 'NO MULTI-COMP: this guest kernel lacks CONFIG_ZRAM_MULTI_COMP' > /var/tmp/no-multicomp; }"]

final_message: "vm-swap-lab ready in $UPTIME seconds"
