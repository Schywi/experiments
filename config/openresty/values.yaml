# Public, non-secret defaults for the OpenResty Hubble UI proxy.

replicaCount: 1

# Keep the Service name stable across the Tilt bootstrap and Argo CD release.
fullnameOverride: cilium-dashboard

image:
  repository: openresty/openresty
  tag: "1.27.1.2-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  annotations: {}

# The Cilium Hubble UI is installed by the Cilium chart in kube-system by
# default. Keep this a DNS name so no cluster-specific address is committed.
hubble:
  service: hubble-ui.kube-system.svc.cluster.local
  port: 80

networkPolicy:
  enabled: true
  # The release namespace is always allowed. Add namespaces here when an
  # explicitly approved in-cluster frontend needs to reach this proxy.
  allowedNamespaces: []

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
