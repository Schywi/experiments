# agent-sandbox platform, version-pinned.
#
# The controller and the four CRDs are NOT here: upstream publishes them as a
# release manifest, and `install.sh` applies that pinned file. This chart owns
# the three objects the console actually needs -- the router, the browser
# SandboxTemplate and the warm pool -- plus their namespaces.
#
# Router flags and the NetworkPolicy port list are the two places this chart
# deliberately differs from upstream's `sandbox-router/deploy/`. Both
# differences are explained where they appear.

router:
  namespace: agent-sandbox-system
  # One replica: this is a single-node cluster, so a second replica buys no
  # availability and the PDB below is a formality.
  replicas: 1
  image:
    repository: registry.k8s.io/agent-sandbox/sandbox-router-go
    # Same release as the controller manifest install.sh applies. v1.0.7 is a
    # published tag; upstream's own deploy/ manifest pins `:latest`, which is
    # never published (examples/document-conversion-sandbox/README.md).
    tag: v1.0.7
    pullPolicy: IfNotPresent
  authz:
    # tokenreview: the router validates the caller's bearer token against the
    # cluster's TokenReview API. The console presents its ServiceAccount token.
    # `allow-all` would let anyone who can reach the router drive any sandbox in
    # the namespace.
    mode: tokenreview
    requireToken: true
  # The router's egress policy allows the API server by port (443/6443) and not
  # by address: Cilium translates the `kubernetes` ClusterIP to the host backend
  # before egress policy runs, so no ipBlock can name it. See the NetworkPolicy
  # template for the failure that costs.
  cache:
    # Resolve the live Pod IP from an informer instead of cluster DNS. Template
    # pods have no per-sandbox Service, so the DNS form is NXDOMAIN for them.
    enabled: true
  proxyTimeout: 180s
  upstreamMaxRetries: "3"
  clusterDomain: cluster.local
  service:
    # ClusterIP, not LoadBalancer. The LAN pool (192.168.0.240-250) is fully
    # allocated: .248 and .249 went to the two kargo-gateway LoadBalancers on
    # 2026-10-24, and .240-.247 were already in use. Only .250 is left, and the
    # console takes it because that is the address a human opens.
    #
    # The console reaches the router over this ClusterIP, so the pane works
    # without it. For CDP from a laptop, port-forward instead:
    #   kubectl -n agent-sandbox-system port-forward svc/sandbox-router-svc 8080:8080
    type: ClusterIP
    loadBalancerIP: ""
    port: 8080
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      # No CPU limit, same policy as the sandbox template: the router is on the
      # data path, and a quota throttles it exactly when the cluster is busy.
      # cpu: 200m
      memory: 128Mi

sandboxes:
  namespace: sandbox-demo
  # Two cells, one pod shape each. A cell is (SandboxTemplate, SandboxWarmPool);
  # session-lab picks one per session through --pool-by-class, so the class
  # chooses the pool, the pool chooses the template, the template chooses the
  # pod. The CPU cell is the default and the one the console's tiles use.
  templates:
    - name: browser-tpl
      # Built by apps/browser-sandbox and pushed to the in-cluster registry.
      # Always: the in-cluster registry serves a mutable `:local` tag, so a cached
      # image must not be reused (the same reason the assistant chart says Always).
      image: 127.0.0.1:5000/browser-sandbox:local
      pullPolicy: Always
      # Rendered as the pod annotation session-lab.io/spill. It names the memory
      # tier the swap study measured (research/swap-capacity/): none, zram-2to1,
      # zram-5to1, disk. Nothing in Kubernetes acts on it: the swap experiment's
      # cgroup writer selects pods by this annotation, and session-lab reads it
      # back so a run reports which tier each class was given. Empty = no
      # annotation, which the report shows as tier "-".
      spill: zram-5to1
      targetUrl: https://example.com/
      # The port Chromium's DevTools answers on inside the pod, and the port the
      # bridge publishes for HTTP callers.
      cdpUpstreamPort: 9223
      cdpPort: 9222
      # Sidecar that republishes loopback:9223 on the pod IP over raw TCP, so a
      # CDP client outside the pod can hold a WebSocket to Chromium directly.
      # Built from apps/cdp-forward and pushed by config/registry/kaniko-build.sh.
      forwarder:
        image: 127.0.0.1:5000/session-lab-cdp-forward:local
        pullPolicy: Always
        port: 9224
      resources:
        requests:
          # 10m, from 100m: the oversubscription lever under test. A request is
          # admission, not enforcement — with no CPU limit the browser still bursts
          # to whatever the node has, so this only changes how many pods the
          # scheduler will place (66 by the pod cap, not by CPU).
          cpu: 10m
          # Measured on this cluster (cgroup memory.peak, no sessions running):
          # an idle browser pod needs ~190 MiB, and ~360 MiB while carrying eight
          # real-page contexts. The request is an overcommit lever, not a cap: at
          # 128Mi the scheduler admits more pods than the node has physical memory
          # for, which is exactly what the oversubscription study measures. The
          # 768Mi limit stays as the hard ceiling.
          memory: 128Mi
        limits:
          # POLICY: no CPU limit. A CPU limit is a CFS quota, and a browser that
          # touches it is throttled even while the node is idle — 248 of 360
          # measured sessions were throttled at the "1" this field used to set.
          # CPU is compressible, so a pod without a quota simply competes on
          # shares; the request above is the scheduling guarantee. See
          # research/session-lifecycle-elasticity/12-cpu-requests-not-limits.md.
          #
          # Memory keeps its limit: memory is incompressible, and without one a
          # single sandbox grows until the node OOMs.
          #
          # The field is commented out rather than deleted so nobody re-adds it
          # by habit without reading the note.
          # cpu: "1"
          memory: 768Mi
      dshmSizeLimit: 512Mi

    # GPU cell. Same Chromium, same CDP ports, same readiness probe, same
    # forwarder; the difference is the image (mesa-vulkan-drivers + RADV ICD) and
    # the device access the pod needs. The device plugin advertises amd.com/render
    # as one unit for the whole node, so the pod takes the render node the way the
    # Track C probe does: privileged, with the host's /dev/dri mounted. That is
    # the shape the GPU A/B measured (research/session-lifecycle-elasticity/19),
    # written down here so the arm can be re-run from the repository alone.
    - name: browser-tpl-gpu
      # Built by apps/browser-sandbox/Containerfile.vulkan and pushed by
      # config/sandbox/build/browser-sandbox-vulkan-job.yaml.
      image: 127.0.0.1:5000/browser-sandbox-vulkan:local
      pullPolicy: Always
      spill: zram-5to1
      targetUrl: https://example.com/
      cdpUpstreamPort: 9223
      cdpPort: 9222
      privileged: true
      driMount:
        hostPath: /dev/dri
        mountPath: /dev/dri
      forwarder:
        image: 127.0.0.1:5000/session-lab-cdp-forward:local
        pullPolicy: Always
        port: 9224
      resources:
        requests:
          cpu: 10m
          # ~460 MiB resident was measured for a privileged pod with the RADV
          # driver loaded (note 19), so the request stays an overcommit lever.
          memory: 128Mi
        limits:
          # 840Mi, not the 768Mi the bulk cell keeps. Measured on 2026-11-06:
          # eight contexts on the heavy page (the LeBlanc champion page at
          # RIOT_HEAVY=8) hold ~730-760 MiB of *anonymous* memory, and the 768Mi
          # ceiling killed the whole container three runs in a row
          # (memory: usage 786432kB, limit 786432kB; anon 754368512; failcnt
          # 11749). The OOM killed the browser process with its contexts, so
          # eight sessions reported "browser lost" and the run failed. zram swap
          # moved ~59 MiB out and did not help: anon cannot be reclaimed.
          # Headroom above the measured peak, not a new policy: the request above
          # stays the overcommit lever.
          memory: 840Mi
      dshmSizeLimit: 512Mi

  pools:
    - name: browser-pool
      template: browser-tpl
      # 8, not the 12 a full grid draws. Experiment 02 measured ~9.1 *active*
      # Chromium instances against this host's free CPU; idle memory would allow
      # ~28, and the difference is what makes a 12-tile grid lag during a demo.
      replicas: 8
    # GPU cell starts empty: an experiment raises it, so an idle demo never holds
    # privileged pods with the render node attached.
    - name: browser-pool-gpu
      template: browser-tpl-gpu
      replicas: 0
