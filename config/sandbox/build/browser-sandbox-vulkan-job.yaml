apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-browser-sandbox-vulkan
  namespace: registry
  labels:
    app.kubernetes.io/name: kaniko
    app.kubernetes.io/part-of: agent-sandbox-lab
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaniko
    spec:
      restartPolicy: Never
      initContainers:
        # See browser-sandbox-job.yaml: a ConfigMap volume is symlinks, and COPY
        # would carry the link (the entrypoint would be a dangling symlink).
        - name: dereference-context
          image: busybox:1.36
          command:
            - sh
            - -c
            - cp -rL /ctx/. /workspace/ && ls -l /workspace
          volumeMounts:
            - name: context
              mountPath: /ctx
            - name: work
              mountPath: /workspace
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - "--context=dir:///workspace"
            - "--dockerfile=/workspace/Containerfile.vulkan"
            # The GPU cell's image: same Chromium, mesa Vulkan drivers added, the
            # Vulkan entrypoint instead of the --disable-gpu one.
            - "--destination=192.168.0.28:5000/browser-sandbox-vulkan:local"
            - "--insecure"
            - "--cache=true"
            - "--cache-repo=192.168.0.28:5000/kaniko-cache-browser-vulkan"
            - "--force"
            - "--verbosity=info"
          volumeMounts:
            - name: work
              mountPath: /workspace
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: context
          configMap:
            name: ctx-browser-sandbox-vulkan
        - name: work
          emptyDir: {}
