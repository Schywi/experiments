apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ .Values.sandboxes.template.name }}
  namespace: {{ .Values.sandboxes.namespace }}
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
spec:
  # Managed (the default) makes the controller generate one NetworkPolicy per
  # template. That policy is what the isolation badge reports:
  #   ingress  only from pods labelled app=sandbox-router in agent-sandbox-system
  #   egress   0.0.0.0/0 except 10/8, 172.16/12, 192.168/16, 169.254/16
  #   dnsPolicy None with public resolvers, no search domain
  #   automountServiceAccountToken false
  # A bare `kind: Sandbox` gets none of that (experiment 01, H4 caveat), which
  # is why the console draws tiles from claims only.
  networkPolicyManagement: Managed
  podTemplate:
    metadata:
      labels:
        app: browser-sandbox
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      containers:
        - name: browser
          image: {{ .Values.sandboxes.template.image }}
          imagePullPolicy: {{ .Values.sandboxes.template.pullPolicy }}
          ports:
            - name: cdp
              containerPort: {{ .Values.sandboxes.template.cdpPort }}
          env:
            - name: CDP_PORT
              value: {{ .Values.sandboxes.template.cdpPort | quote }}
            - name: TARGET_URL
              value: {{ .Values.sandboxes.template.targetUrl | quote }}
            - name: WINDOW_SIZE
              value: "1280,600"
          # The readiness probe is the whole point of the template: it makes
          # Sandbox Ready=True mean "CDP answers /json/version", which is what a
          # tile's first frame depends on. A cold Chromium boot is ~40 s.
          readinessProbe:
            httpGet:
              path: /json/version
              port: cdp
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml .Values.sandboxes.template.resources | nindent 12 }}
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
        # Chromium binds DevTools to 127.0.0.1 whatever --remote-debugging-address
        # says, so a client outside the pod cannot reach it. This sidecar shares
        # the pod's network namespace and splices bytes from the pod IP to that
        # loopback port: an HTTP request, a WebSocket upgrade and a raw CDP frame
        # all arrive unchanged.
        - name: cdp-forward
          image: {{ .Values.sandboxes.template.forwarder.image }}
          imagePullPolicy: {{ .Values.sandboxes.template.forwarder.pullPolicy }}
          ports:
            - name: cdp-ws
              containerPort: {{ .Values.sandboxes.template.forwarder.port }}
          env:
            - name: CDP_FORWARD_LISTEN
              value: ":{{ .Values.sandboxes.template.forwarder.port }}"
            - name: CDP_FORWARD_UPSTREAM
              value: "127.0.0.1:{{ .Values.sandboxes.template.cdpUpstreamPort }}"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              # No CPU limit, same policy as the browser container (note 12).
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.sandboxes.template.dshmSizeLimit }}
