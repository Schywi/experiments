{{- range .Values.sandboxes.pools }}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.sandboxes.namespace }}
  labels:
    {{- include "sandbox.labels" $ | nindent 4 }}
spec:
  replicas: {{ .replicas }}
  sandboxTemplateRef:
    name: {{ .template }}
{{- end }}
