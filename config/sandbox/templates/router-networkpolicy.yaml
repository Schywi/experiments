# The router's own policy. Upstream's copy allows egress to sandbox port 8888
# only; that is the rule that would turn every tile into a 502, because this
# stack drives Chromium on 9222. The port list below is the one deliberate
# difference from `sandbox-router/deploy/networkpolicy.yaml`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-router
  namespace: {{ .Values.router.namespace }}
  labels:
    {{- include "sandbox.routerSelector" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sandbox.routerSelector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Proxy traffic: the console, and anything else on the LAN that reaches the
    # LoadBalancer. The router authenticates callers with TokenReview.
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus-format metrics, for a Grafana panel later.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9090
    # Kubelet probes hit the pod IP directly.
    - ports:
        - protocol: TCP
          port: 8081
  egress:
    # DNS for anything the DNS form of resolution still needs.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Sandbox pods: 8888 for the upstream default payload, 9222 for Chromium.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 9222
    # The API server, for the Pod informer (--cache-enabled) and for TokenReview.
    #
    # Port-scoped rather than address-scoped, and that is the whole point. With
    # Cilium's kube-proxy replacement the `kubernetes` ClusterIP (10.43.0.1) is
    # translated to the host backend *before* egress policy is evaluated, so an
    # ipBlock on 10.43.0.1/32 matches nothing: TokenReview then hangs until its
    # 3 s deadline and every request through the router is a 500. A vanilla
    # NetworkPolicy has no `toServices` peer (that is a CiliumNetworkPolicy
    # feature), so the honest expression of "the API server, and nothing else on
    # these ports" is a port-only rule.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
