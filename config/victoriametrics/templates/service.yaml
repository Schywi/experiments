apiVersion: v1
kind: Service
metadata:
  name: {{ include "victoriametrics.fullname" . }}
  labels:
    {{- include "victoriametrics.labels" . | nindent 4 }}
  {{- with .Values.service.loadBalancerIP }}
  annotations:
    # Pin the external IP (Cilium LB IPAM) so clients reach vmui at a bare IP.
    io.cilium/lb-ipam-ips: {{ . | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  externalTrafficPolicy: Cluster
  {{- end }}
  selector:
    {{- include "victoriametrics.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.webPort }}
    # Port 80 so the LoadBalancer IP serves vmui without a :8428 suffix.
    - name: web
      port: {{ .Values.service.webPort }}
      targetPort: http
    {{- end }}
