apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "victoriametrics.fullname" . }}-scrape
  labels:
    {{- include "victoriametrics.labels" . | nindent 4 }}
data:
  scrape.yml: |
    # VictoriaMetrics single-node scrapes the Cilium, Hubble, and operator
    # metrics endpoints directly; there is no Prometheus Operator and therefore
    # no ServiceMonitor. Each Cilium component is discovered by its pod label in
    # kube-system and the pod IP is rewritten to the component's metrics port.
    global:
      scrape_interval: {{ .Values.scrapeInterval }}
    scrape_configs:
      - job_name: cilium-agent
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: cilium
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: ${1}:9962
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      - job_name: cilium-hubble
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: cilium
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: ${1}:9965
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      - job_name: cilium-operator
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_io_cilium_app]
            action: keep
            regex: operator
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: ${1}:9963
      - job_name: hubble-relay
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: hubble-relay
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: ${1}:9966
      # Assistant LLM instrumentation (per-stage tokens/timings) on /metrics.
      - job_name: assistant
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - assistant
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: assistant
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: ${1}:8080
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      {{- if .Values.sessionLab.enabled }}
      # session-lab session lifecycle and resource series. The runner runs on the
      # node (it reads the host's cgroup files), so this is a static target: the
      # endpoint answers while a run is in progress and disappears between runs.
      - job_name: session-lab
        metrics_path: {{ .Values.sessionLab.metricsPath }}
        static_configs:
          - targets:
              {{- toYaml .Values.sessionLab.targets | nindent 14 }}
      # The pool autoscaler: demand, computed target, configured bounds and the
      # scale-out delay it measured.
      - job_name: session-lab-autoscaler
        metrics_path: {{ .Values.sessionLab.metricsPath }}
        static_configs:
          - targets:
              {{- toYaml .Values.sessionLab.autoscalerTargets | nindent 14 }}
      {{- end }}
