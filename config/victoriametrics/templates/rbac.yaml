{{- if .Values.rbac.create }}
# Read-only cluster access so the VictoriaMetrics scrape config can discover the
# Cilium agent, Cilium operator, and Hubble relay pods via kubernetes_sd_configs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "victoriametrics.fullname" . }}-discovery
  labels:
    {{- include "victoriametrics.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "victoriametrics.fullname" . }}-discovery
  labels:
    {{- include "victoriametrics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "victoriametrics.fullname" . }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
