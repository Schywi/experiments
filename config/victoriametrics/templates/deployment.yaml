apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "victoriametrics.fullname" . }}
  labels:
    {{- include "victoriametrics.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "victoriametrics.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "victoriametrics.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/scrape: {{ include (print $.Template.BasePath "/configmap-scrape.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoriametrics
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -storageDataPath=/victoria-metrics-data
            - -retentionPeriod={{ .Values.retentionPeriod }}
            - -httpListenAddr=:{{ .Values.service.port }}
            - -promscrape.config=/etc/victoriametrics/scrape.yml
            # The scrape config uses only documented Prometheus fields; keep the
            # parser lenient so a future VictoriaMetrics default does not stop
            # the whole store.
            - -promscrape.config.strictParse=false
            - -promscrape.configCheckInterval={{ .Values.scrapeConfigCheckInterval }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: scrape
              mountPath: /etc/victoriametrics
              readOnly: true
            - name: data
              mountPath: /victoria-metrics-data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scrape
          configMap:
            name: {{ include "victoriametrics.fullname" . }}-scrape
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "victoriametrics.fullname" . }}
        - name: tmp
          emptyDir: {}
