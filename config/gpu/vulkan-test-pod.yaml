apiVersion: v1
kind: Pod
metadata:
  name: vulkan-test
  labels: {app.kubernetes.io/part-of: gpu-lab}
spec:
  restartPolicy: Never
  securityContext:
    supplementalGroups: [105]
  dnsConfig:
    options:
      - {name: ndots, value: "1"}
  containers:
    - name: vulkan
      image: fedora:44
      securityContext:
        privileged: true
      command:
        - sh
        - -c
        - |
          set -e
          dnf -y install mesa-vulkan-drivers vulkan-tools >/dev/null 2>&1
          echo "=== VULKAN DEVICES ==="
          vulkaninfo --summary 2>/dev/null
      volumeMounts:
        - {name: dri, mountPath: /dev/dri}
  volumes:
    - {name: dri, hostPath: {path: /dev/dri}}
