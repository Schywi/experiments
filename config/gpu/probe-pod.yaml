# Track C device-access probe: does a non-privileged Pod see the GPU?
#
# Result on the reference host (Fedora 44, AMD RX 570 / gfx803, amdgpu + Mesa):
#   YES -- /dev/dri/renderD128 is visible, with the render group (gid 105).
#
# Apply, read the logs, delete:
#   kubectl apply -f config/gpu/probe-pod.yaml
#   kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/gpu-probe --timeout=60s
#   kubectl logs gpu-probe
#   kubectl delete -f config/gpu/probe-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: gpu-probe
  labels:
    app.kubernetes.io/part-of: gpu-lab
spec:
  restartPolicy: Never
  # The render node is group-owned by 'render' (gid 105 on this host); the Pod
  # joins that group instead of running privileged.
  securityContext:
    supplementalGroups: [105]
  containers:
    - name: probe
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "--- /dev/dri ---"
          ls -l /dev/dri
          echo "--- identity ---"
          id
      volumeMounts:
        - name: dri
          mountPath: /dev/dri
  volumes:
    - name: dri
      hostPath:
        path: /dev/dri
        type: Directory
