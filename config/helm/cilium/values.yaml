# Public baseline values for the Cilium Helm chart.
#
# The API endpoint is supplied by config/k3d/install-cilium.sh at install time;
# do not put a machine-specific address or credential in this file.
# Keep kube-proxy replacement enabled for the Cilium ingress NodePort path.
kubeProxyReplacement: true

# MetalLB speakers use hostNetwork and reach the Kubernetes API through its
# ClusterIP. With kube-proxy disabled, host-namespace socket LB is required.
socketLB:
  enabled: true
  hostNamespaceOnly: true

# Official Cilium images use quay.io. This is the user-approved exception to
# the repository's Docker Hub-only image policy.

# The k3d host kernel rejects Cilium 1.20's BPF SNAT program. Use the supported
# iptables masquerading path while retaining eBPF kube-proxy replacement.
# BPF TProxy remains disabled; Cilium Ingress uses the iptables proxy path.
bpf:
  masquerade: false
  hostLegacyRouting: true
  # This is a single-node observability lab: retain every packet trace so
  # Hubble can render short-lived local service traffic.
  monitorAggregation: none
  tproxy: false

ipam:
  mode: kubernetes

# Datapath metrics for the Cilium agent and operator panels of the Grafana
# dashboards in config/grafana. config/victoriametrics scrapes the agent on
# port 9962 and the operator on port 9963. No Prometheus Operator is installed,
# so ServiceMonitors stay disabled.
prometheus:
  enabled: true
  port: 9962

operator:
  replicas: 1
  prometheus:
    enabled: true
    port: 9963

hubble:
  enabled: true
  # Export Hubble flows as Prometheus metrics for the observability stack
  # (config/victoriametrics + config/grafana). The cilium-agent serves them on
  # port 9965 and config/victoriametrics scrapes them; no Prometheus Operator is
  # installed, so no ServiceMonitor is requested.
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"
    port: 9965
  relay:
    enabled: true
    # Hubble relay metrics on port 9966, scraped by config/victoriametrics.
    prometheus:
      enabled: true
      port: 9966
  ui:
    enabled: true
    backend:
      image:
        repository: quay.io/cilium/hubble-ui-backend
        tag: v0.13.5
        digest: sha256:fac0c300ae119274edca11fd89b1ad23c788792d8bc4ea2ba631c709e8d3c688
        useDigest: true
        pullPolicy: IfNotPresent
    frontend:
      image:
        repository: quay.io/cilium/hubble-ui
        tag: v0.13.5
        digest: sha256:f7d514fc54d784ed6df9d58cf0e97648b143f92b766dd1780ed3fc845bd4c516
        useDigest: true
        pullPolicy: IfNotPresent

# Run Cilium's Kubernetes Ingress Controller. The MetalLB overlay changes its
# Service to LoadBalancer after MetalLB is healthy; the NodePort is retained
# for the k3d localhost fallback.
ingressController:
  enabled: true
  loadbalancerMode: shared
  service:
    type: NodePort
    externalTrafficPolicy: Cluster
    insecureNodePort: 30080
