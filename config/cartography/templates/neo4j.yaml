apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cartography.fullname" . }}-neo4j
  labels:
    {{- include "cartography.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.neo4j.storage.size }}
  {{- with .Values.neo4j.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cartography.fullname" . }}-neo4j
  labels:
    {{- include "cartography.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cartography.neo4jSelectorLabels" . | nindent 4 }}
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: http
      port: 7474
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cartography.fullname" . }}-neo4j
  labels:
    {{- include "cartography.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cartography.neo4jSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cartography.neo4jSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: experiments-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: neo4j
          image: "{{ .Values.neo4j.image.repository }}@{{ .Values.neo4j.image.digest }}"
          imagePullPolicy: {{ .Values.neo4j.image.pullPolicy }}
          ports:
            - name: bolt
              containerPort: 7687
              protocol: TCP
            - name: http
              containerPort: 7474
              protocol: TCP
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.neo4j.authSecretName }}
                  key: auth
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.neo4j.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "cartography.fullname" . }}-neo4j
        - name: logs
          emptyDir: {}
