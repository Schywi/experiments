apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grafana.fullname" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "grafana.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grafana.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/datasources: {{ include (print $.Template.BasePath "/configmap-datasources.yaml") . | sha256sum }}
        checksum/dashboard-provider: {{ include (print $.Template.BasePath "/configmap-dashboard-provider.yaml") . | sha256sum }}
        {{- if .Values.dashboards.enabled }}
        checksum/dashboards: {{ include (print $.Template.BasePath "/configmap-dashboards.yaml") . | sha256sum }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # No-auth lab: anonymous admin, no basic-auth login form. This
            # mirrors the headless Argo CD and unauthenticated Neo4j already in
            # the repository, and keeps credentials out of the public repo.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: {{ .Values.auth.anonymous.enabled | quote }}
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: {{ .Values.auth.anonymous.orgRole | quote }}
            - name: GF_AUTH_BASIC_ENABLED
              value: {{ .Values.auth.basic.enabled | quote }}
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            {{- if .Values.homeDashboard.enabled }}
            # Open straight onto a dashboard instead of the empty Grafana home.
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: {{ .Values.homeDashboard.path | quote }}
            {{- end }}
            # The cluster has no route to grafana.com; these checks only delay
            # startup (GET https://grafana.com ... i/o timeout) and can trip the
            # startup/liveness probes on this single-node lab.
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            # Omit X-Frame-Options: deny so the fuwa shell can iframe Grafana.
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: {{ .Values.security.allowEmbedding | quote }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            {{- if .Values.dashboards.enabled }}
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: provisioning-datasources
          configMap:
            name: {{ include "grafana.fullname" . }}-datasources
        - name: provisioning-dashboards
          configMap:
            name: {{ include "grafana.fullname" . }}-dashboard-provider
        {{- if .Values.dashboards.enabled }}
        - name: dashboards
          configMap:
            name: {{ include "grafana.fullname" . }}-dashboards
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "grafana.fullname" . }}
        - name: tmp
          emptyDir: {}
