# Public-repository baseline for the official argo-cd Helm chart.
#
# This cluster is a private, Docker-backed k3d development cluster. The user
# explicitly requested headless/no-auth Argo CD; exposure remains ClusterIP
# only with ingress disabled.

configs:
  cm:
    create: true
    admin.enabled: false
  params:
    create: true
    server.insecure: "true"
    server.disable.auth: "true"
  rbac:
    create: true
    policy.default: ""

server:
  service:
    type: ClusterIP
  ingress:
    enabled: false
