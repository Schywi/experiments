# Public-repository baseline for the official argo-cd Helm chart.
#
# This cluster is a private, Docker-backed k3d development cluster. The user
# explicitly requested headless/no-auth Argo CD; exposure remains ClusterIP
# only with ingress disabled.

configs:
  cm:
    create: true
    admin.enabled: false
  params:
    create: true
    server.insecure: "true"
    server.disable.auth: "true"
  rbac:
    create: true
    policy.default: ""

server:
  service:
    type: ClusterIP
  ingress:
    enabled: false

# The chart default probe timeout is 1s. On this single-node cluster the
# repo-server health check intermittently exceeds it, so the liveness probe
# kills the pod and it never becomes Ready (CrashLoopBackOff). Widen the
# timeouts so the repo-server stays up and can serve manifests.
repoServer:
  livenessProbe:
    timeoutSeconds: 15
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
