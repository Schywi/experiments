apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-console
  namespace: argocd
  annotations:
    # After the router and the warm pool exist.
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: agent-sandbox-lab
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Schywi/experiments.git
    # Contextual: Argo reads the branch the work is on, NEVER `main`.
    targetRevision: feat/sandbox-console
    path: apps/sandbox-console/chart
    helm:
      releaseName: sandbox-console
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox-console
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
# The chart also creates a read-only Role and RoleBinding in sandbox-demo, where
# the sandboxes live. That cross-namespace object is deliberate: the Role's verbs
# (get/list/watch only) belong next to the resources they describe.
