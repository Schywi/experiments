apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-dashboard
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # The normal reconciliation source is the public repository. Keep this
    # URL unchanged unless deliberately using the documented local mode.
    repoURL: https://github.com/Schywi/experiments.git
    targetRevision: main
    path: config/openresty
    helm:
      releaseName: cilium-dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: openresty
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

