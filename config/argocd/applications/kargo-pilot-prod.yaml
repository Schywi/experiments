apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-pilot-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kargo-pilot
    app.kubernetes.io/managed-by: argocd
  annotations:
    # Consent for Kargo's `prod` Stage to update this Application.
    kargo.akuity.io/authorized-stage: "pilot:prod"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Schywi/experiments.git
    targetRevision: feat/kargo
    path: config/kargo/pilot/app/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo-pilot-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
