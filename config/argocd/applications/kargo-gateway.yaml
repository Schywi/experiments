apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-gateway
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kargo
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Schywi/experiments.git
    targetRevision: feat/kargo
    path: config/kargo/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
