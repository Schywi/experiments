apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: platform-config
spec:
  ingressClassName: cilium
  rules:
    - host: argocd.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
    # LAN-DNS host: the resolver answers argocd.home.arpa -> the shared Cilium
    # ingress LB, no /etc/hosts. argocd.localhost above stays the fallback.
    - host: argocd.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
