# MinIO, the object store behind apps/session-lab's persist arm.
#
# Nothing in the session path needs this: sessions run whether or not it exists.
# Only cmd/persist-lab talks to it, over the S3 API.

image:
  # MinIO ended community distribution: quay.io/minio/minio now answers 401 to an
  # anonymous pull, docker.io/minio/minio was archived, and the release binaries
  # at dl.min.io return 410. The last publicly pullable MinIO is Bitnami's
  # packaging, archived in the bitnamilegacy namespace: 2025.7.23-debian-12-r5
  # is MinIO RELEASE.2025-07-23T15-54-02Z.
  #
  # This is the one place in the repo pinned to an archive. If the store has to
  # outlive the experiment, the choice is a subscription at quay.io or a store
  # that is still published — not a floating tag here.
  repository: docker.io/bitnamilegacy/minio
  tag: 2025.7.23-debian-12-r5
  pullPolicy: IfNotPresent

# Name of the Secret holding the root credentials. It is created by this chart
# with generated values on first install, and preserved across upgrades by
# reading the existing object back. Read them with:
#   kubectl -n <ns> get secret minio-credentials \
#     -o jsonpath='{.data.accessKey}' | base64 -d
credentialsSecret: minio-credentials

# The bucket itself is created by cmd/persist-lab on its first write, so there is
# no init Job and no declarative bucket object.
storage:
  size: 10Gi
  # Empty uses the cluster's default StorageClass.
  storageClass: ""

service:
  port: 9000
  consolePort: 9001
  # NodePort with a fixed port, because persist-lab runs on the host and the
  # runner derives its endpoint from this Service. Pinned here rather than passed
  # with --set at install time, so the repository describes what the cluster runs.
  type: NodePort
  nodePort: 30900

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  # No CPU limit, the same rule the other charts here follow: a quota throttles
  # the store exactly when the node is busy.
  limits:
    memory: 512Mi
