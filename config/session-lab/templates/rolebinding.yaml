apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session-lab-autoscaler
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "session-lab.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-lab-autoscaler
subjects:
  - kind: ServiceAccount
    name: session-lab-autoscaler
    namespace: {{ .Values.sandbox.namespace }}
