# Mark the local in-cluster registry as plain-HTTP so buildah/podman/skopeo can
# reach it without TLS. User-scoped, so it needs no root.
#
#   install:  mkdir -p ~/.config/containers/registries.conf.d
#             cp config/registry/registries.conf ~/.config/containers/registries.conf.d/local-registry.conf
#
# `config/registry/install.sh` does this for you.
[[registry]]
location = "127.0.0.1:5000"
insecure = true
