apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vector.fullname" . }}
  labels:
    {{- include "vector.labels" . | nindent 4 }}
data:
  vector.toml: |
    [api]
    enabled = true
    address = "0.0.0.0:8686"

    [sources.worker_logs]
    type = "file"
    include = ["/var/log/pods/worm-lab_worm-worker-*/*/*.log"]
    read_from = "beginning"

    [transforms.parse_worker_sample]
    type = "remap"
    inputs = ["worker_logs"]
    source = '''
    parsed = parse_regex!(.message, r'^\\S+\\s+stdout\\s+[FP]\\s+(?P<payload>.*)$')
    . = parse_json!(parsed.payload)
    if .kind != "sample" || !is_string(.worm_id) || !is_integer(.sequence) ||
       !is_number(.x) || !is_number(.y) || !is_integer(.occurred_at) {
      abort
    }
    '''

    [sinks.regression]
    type = "http"
    inputs = ["parse_worker_sample"]
    uri = {{ .Values.regression.ingestURL | quote }}
    method = "post"
    encoding.codec = "json"
    request.concurrency = 1
    request.retry_attempts = 5
    request.retry_initial_backoff_secs = 1
    request.retry_max_duration_secs = 5
    batch.max_events = 1
    buffer.type = "memory"
    buffer.max_events = 1200
