apiVersion: v1
kind: Service
metadata:
  name: {{ include "vector.fullname" . }}
  labels:
    {{- include "vector.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: events
      port: {{ .Values.service.port }}
      targetPort: events
      protocol: TCP
  selector:
    {{- include "vector.selectorLabels" . | nindent 4 }}
