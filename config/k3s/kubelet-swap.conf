# Pod swap on this node, as a kubelet drop-in.
#
# The node already swaps: Fedora's zram0 device, 8 GiB, priority 100. What the
# node does with its own pages and what a pod may do are separate decisions, and
# the second one is this file. With no `memorySwap` block kubelet behaves as
# NoSwap and writes memory.swap.max = 0 on every container scope, which is the
# state measured on this cluster before this file existed:
#
#   pod slice        memory.swap.max = max
#   browser scope    memory.swap.max = 0
#   sidecar scope    memory.swap.max = 0
#
# LimitedSwap makes kubelet compute an allowance for Burstable pods:
#
#   request / node allocatable * node swap   = 128Mi / 15.5Gi * 8Gi  ~ 66 MiB
#
# That number is small, and it is only Kubernetes' default. A class that needs
# more gets it written directly on its container scopes, selected by the pod
# annotation session-lab.io/spill, with scripts/swap-allowance.sh.
#
# Installed by install-k3s.sh to
#   /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/90-swap.conf
# Restarting k3s applies it, and that restart kills every sandbox pod
# (restartPolicy: Never), so it is a deliberate act.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
failSwapOn: false
memorySwap:
  swapBehavior: LimitedSwap
