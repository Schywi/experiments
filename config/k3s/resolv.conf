# Cluster resolver referenced by k3s `resolv-conf` (see config.yaml).
#
# Deliberately has NO `search` domain. The host's /etc/resolv.conf carries
# `search mygateway` (from the router's DHCP), and k3s copies that into every
# Pod's resolv.conf. Combined with the default `options ndots:5`, that makes
# resolvers try `<name>.mygateway` first, which coredns forwards to the ISP
# resolvers where it times out -- so any tool that uses getaddrinfo (curl,
# python-requests, every weight downloader) stalls or fails on external names.
#
# Pointing k3s at this file removes the search-domain bleed and gives coredns a
# reliable upstream. The host's own resolver is not modified.
nameserver 1.1.1.1
nameserver 1.0.0.1
