apiVersion: apps/v1
kind: Deployment
metadata:
  name: pilot
  labels:
    app.kubernetes.io/name: kargo-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kargo-pilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kargo-pilot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http
          image: docker.io/library/busybox:1.37.0
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: www
              mountPath: /www
              readOnly: true
      volumes:
        - name: www
          configMap:
            name: pilot-www
