apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# Kargo's `kustomize-set-image` step rewrites this entry during a promotion.
# Keep the image name identical in every overlay so the step has one target.
images:
  - name: docker.io/library/busybox
    newTag: 1.37.0
