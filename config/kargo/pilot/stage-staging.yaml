apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: pilot
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: pilot
      sources:
        direct: true

  promotionTemplate:
    spec:
      steps:
        # Clone the repository that holds both the manifests and this Stage.
        - uses: git-clone
          config:
            repoURL: https://github.com/Schywi/experiments.git
            checkout:
              - branch: feat/kargo
                path: ./repo

        # Write the artifact the Warehouse discovered into the staging overlay.
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./repo/config/kargo/pilot/app/overlays/staging
            images:
              - image: docker.io/library/busybox
                tag: ${{ imageFrom("docker.io/library/busybox").Tag }}

        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: "chore(kargo): promote busybox ${{ imageFrom('docker.io/library/busybox').Tag }} to staging"

        - uses: git-push
          config:
            path: ./repo

        # Pin the Application at the commit just pushed and wait for it to be
        # Synced/Healthy at exactly that revision.
        - uses: argocd-update
          config:
            apps:
              - name: kargo-pilot-staging
                namespace: argocd
                sources:
                  - repoURL: https://github.com/Schywi/experiments.git
                    desiredRevision: ${{ outputs.commit.commit }}
                    updateTargetRevision: true
