apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kargo
resources:
  - deployment.yaml
  - service.yaml

# The proxy source lives next to the manifests and is mounted as a ConfigMap, so
# there is no image to build for it.
configMapGenerator:
  - name: kargo-gateway-script
    files:
      - proxy.py
generatorOptions:
  # The Deployment mounts the ConfigMap by name.
  disableNameSuffixHash: true
