apiVersion: apps/v1
kind: Deployment
metadata:
  name: kargo-gateway
  namespace: kargo
  labels:
    app.kubernetes.io/name: kargo-gateway
    app.kubernetes.io/part-of: kargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kargo-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kargo-gateway
        app.kubernetes.io/part-of: kargo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: docker.io/library/python:3.13-alpine
          command: ["python3", "/app/proxy.py"]
          env:
            - name: KARGO_UPSTREAM
              value: https://kargo-api.kargo.svc:443
            - name: KARGO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kargo-gateway-admin
                  key: KARGO_ADMIN_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: kargo-gateway-script
