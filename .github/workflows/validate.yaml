name: Validate platform configuration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.17.1
  KUBECONFORM_VERSION: v0.6.7

jobs:
  manifests:
    name: Helm and Kubernetes manifest validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: false

      - name: Install pinned kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}

      - name: Add Go tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Validate Helm charts and rendered manifests
        run: config/ci/validate.sh
