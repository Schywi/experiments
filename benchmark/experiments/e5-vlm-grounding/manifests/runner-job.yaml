# The runner Job: one arm per invocation, so the arms cannot overlap.
#
# Inputs:
#   ConfigMap e5-runner  — runner.py, tasks.json, labels.json (text)
#   PVC       vlm-frames — the exact PNGs each arm is shown, copied in once by
#                          run_arm.sh (three 1280x600 PNGs are ~390 KB, over the
#                          256 KiB a ConfigMap can carry)
#
#   bash run_arm.sh smolvlm2
#
# The result is read back from the Job's log: one `ROW {json}` line per task and
# a final `RESULT_JSON {json}` line, the shape e4-gpu-e2e already uses.
apiVersion: batch/v1
kind: Job
metadata:
  name: e5-run-smolvlm2
  namespace: vlm-exp
  labels: {app.kubernetes.io/part-of: vlm-lab, arm: smolvlm2}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: vlm-lab, arm: smolvlm2}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: runner
          image: python:3.12-slim
          command: ["python3", "/fixtures/runner.py"]
          env:
            - {name: ARM, value: smolvlm2}
            - {name: MODEL_URL, value: "http://vlm-smolvlm2:8000"}
            - {name: FIXTURES, value: /fixtures}
            - {name: FRAMES, value: /frames}
            - {name: TIMEOUT, value: "600"}
            # Enough room for a stubborn model to finish its JSON object.
            - {name: MAX_TOKENS, value: "320"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: fixtures, mountPath: /fixtures, readOnly: true}
            - {name: frames, mountPath: /frames, readOnly: true}
      volumes:
        - name: fixtures
          configMap: {name: e5-runner}
        - name: frames
          persistentVolumeClaim: {claimName: vlm-frames, readOnly: true}
