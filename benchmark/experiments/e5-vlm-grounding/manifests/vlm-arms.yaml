    metadata:
      labels: {arm: qwen3vl, app.kubernetes.io/part-of: vlm-lab}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile: {type: RuntimeDefault}
