              mkdir -p "$dir"
              base=https://huggingface.co/ggml-org/Qwen3-VL-2B-Instruct-GGUF/resolve/main
              for f in Qwen3-VL-2B-Instruct-Q8_0.gguf mmproj-Qwen3-VL-2B-Instruct-Q8_0.gguf; do
                [ -f "$dir/$f" ] || curl -fL --retry 3 -o "$dir/$f" "$base/$f"
              done
              ls -l "$dir"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: models, mountPath: /models}
      containers:
        - name: vlm
          image: 127.0.0.1:5000/vlm-server:local
          imagePullPolicy: Always
          args:
            - "-m"
            - "/models/qwen3vl/Qwen3-VL-2B-Instruct-Q8_0.gguf"
            - "--mmproj"
            - "/models/qwen3vl/mmproj-Qwen3-VL-2B-Instruct-Q8_0.gguf"
            - "-ngl"
            - "99"
            - "-c"
            - "4096"
            - "--threads"
            - "4"
            # Qwen3-VL's chat template lives in the GGUF metadata; without this
            # llama-server falls back to a template that drops the image part.
            - "--jinja"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          ports:
            - {name: http, containerPort: 8000}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            - {name: HOME, value: /tmp}
          resources:
            requests: {cpu: "1", memory: 2Gi, amd.com/render: 1}
            limits: {cpu: "4", memory: 4Gi, amd.com/render: 1}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: vlm-models}
        - name: tmp
          emptyDir: {}
