# In-cluster build of the VLM server: llama.cpp with the Vulkan backend, which
# also carries libmtmd (the vision projector path llama-server uses for
# `--mmproj`). Same Containerfile as E3's `llama-vulkan`, copied rather than
# referenced so E3 stays frozen.
#
# The build context comes from a ConfigMap in this namespace, because the work is
# not on a branch yet. A ConfigMap volume is symlinks, so a busybox init
# container dereferences it into an emptyDir first — kaniko's COPY would
# otherwise carry the link and the image would have a dangling Containerfile.
#
#   kubectl create configmap ctx-vlm-server -n registry \
#     --from-file=Containerfile=benchmark/experiments/e5-vlm-grounding/vlm-server/Containerfile
#   kubectl apply -f benchmark/experiments/e5-vlm-grounding/manifests/kaniko-vlm-server.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-vlm-server
  namespace: registry
  labels:
    app.kubernetes.io/name: kaniko
    app.kubernetes.io/part-of: vlm-lab
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaniko
    spec:
      restartPolicy: Never
      initContainers:
        - name: dereference-context
          image: busybox:1.36
          command:
            - sh
            - -c
            - cp -rL /ctx/. /workspace/ && ls -l /workspace
          volumeMounts:
            - name: context
              mountPath: /ctx
            - name: work
              mountPath: /workspace
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - "--context=dir:///workspace"
            - "--dockerfile=/workspace/Containerfile"
            - "--destination=192.168.0.28:5000/vlm-server:local"
            - "--insecure"
            # llama.cpp compiles from source here; the git clone and the dnf
            # layer are worth reusing between runs.
            - "--cache=true"
            - "--cache-repo=192.168.0.28:5000/kaniko-cache-vlm"
            - "--force"
            - "--verbosity=info"
          volumeMounts:
            - name: work
              mountPath: /workspace
          resources:
            # nvcc-free but not cheap: 6-target Ninja build of llama.cpp plus
            # glslc for the Vulkan shaders. The first attempt with a 4Gi ceiling
            # was OOMKilled at 400/550 objects, so the ceiling is 6Gi; the request
            # stays low because the node is shared with the desktop.
            requests:
              cpu: 500m
              memory: 1500Mi
            limits:
              cpu: "4"
              memory: 6Gi
      volumes:
        - name: context
          configMap:
            name: ctx-vlm-server
        - name: work
          emptyDir: {}
