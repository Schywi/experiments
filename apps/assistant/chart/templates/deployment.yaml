apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "assistant.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "assistant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "assistant.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: assistant
      # Milestone 2: read the Kubernetes API as this ServiceAccount, bounded by
      # the read-only ClusterRole in rbac.yaml. No token is mounted when RBAC is
      # disabled (Milestone 1, text-only).
      automountServiceAccountToken: {{ .Values.rbac.create }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: assistant
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: LLM_URL
              value: {{ .Values.llm.url | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: REQUEST_TIMEOUT
              value: {{ .Values.llm.timeoutSeconds | quote }}
            - name: AUDIT_LOG
              value: /var/log/assistant/audit.jsonl
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: audit
              mountPath: /var/log/assistant
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: audit
          emptyDir: {}
        - name: tmp
          emptyDir: {}
