apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "assistant.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "assistant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "assistant.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: assistant
      # Milestone 1 makes no Kubernetes API calls; do not mount a token. The
      # read-only RBAC boundary is added at Milestone 2.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: assistant
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: LLM_URL
              value: {{ .Values.llm.url | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: REQUEST_TIMEOUT
              value: {{ .Values.llm.timeoutSeconds | quote }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
