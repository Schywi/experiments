{{- if .Values.rbac.create }}
# Least-privilege, read-only ClusterRole for the assistant. The tool set in
# tools.py is bounded by exactly these verbs and resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: assistant-readonly
  labels:
    {{- include "assistant.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes", "namespaces", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # get_topology: routing edges (ingress->service) reads ingresses.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # get_topology_snapshot: the Cartography CronJob's last ingest time.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: assistant-readonly
  labels:
    {{- include "assistant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: assistant-readonly
subjects:
  - kind: ServiceAccount
    name: assistant
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.allowActions }}
---
# M9: the only write access the assistant can ever hold. Bounded to restart
# (patch deployments) and scale (deployments/scale); no delete, no create.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: assistant-operator
  labels:
    {{- include "assistant.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: assistant-operator
  labels:
    {{- include "assistant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: assistant-operator
subjects:
  - kind: ServiceAccount
    name: assistant
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
