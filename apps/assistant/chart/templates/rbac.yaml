{{- if .Values.rbac.create }}
# Least-privilege, read-only ClusterRole for the assistant. The tool set in
# tools.py is bounded by exactly these verbs and resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: assistant-readonly
  labels:
    {{- include "assistant.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: assistant-readonly
  labels:
    {{- include "assistant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: assistant-readonly
subjects:
  - kind: ServiceAccount
    name: assistant
    namespace: {{ .Release.Namespace }}
{{- end }}
