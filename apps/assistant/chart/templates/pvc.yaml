apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assistant-memory
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "assistant.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.memory.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.memory.size }}
