# Built locally (buildah) and pushed to the in-cluster registry (config/registry/).
image:
  repository: 127.0.0.1:5000/assistant
  tag: local
  # Always: the in-cluster Kaniko build (config/registry/kaniko-build.sh) pushes a
  # mutable `:local` tag, so a cached image must not be reused.
  pullPolicy: Always

# Upstream LLM: the in-cluster llama.cpp service (apps/models/llm).
llm:
  url: http://llm.models.svc.cluster.local:8000
  model: qwen2.5-1.5b-instruct
  timeoutSeconds: "60"

# M5: read-only PromQL source. The in-cluster VictoriaMetrics store
# (config/victoriametrics, namespace observability).
vm:
  url: http://victoriametrics.observability.svc.cluster.local:8428
  queryTimeoutSeconds: "5"

# M6: optional documentation corpus, mounted read-only at /corpus. Build it with
# scripts/assistant-corpus.sh. Absent/empty => search_knowledge reports "no
# corpus" instead of failing.
corpus:
  configMapName: assistant-corpus

# M8: voice is a bolt-on. TTS is the in-cluster Kokoro service; STT is optional
# (point sttUrl at a local OpenAI-compatible transcription service to enable it).
voice:
  kokoroUrl: http://kokoro.models.svc.cluster.local:8000
  kokoroVoice: af_sarah
  sttUrl: ""

# M10: durable memory (long-term notes + per-session history) on a small PVC.
memory:
  size: 1Gi
  storageClassName: ""

service:
  port: 8080
  # Give the assistant its own LoadBalancer IP (Cilium LB IPAM, lan-pool) so you
  # can reach it directly at http://192.168.0.243/ with no /etc/hosts entry —
  # the ingress (assistant.localhost) still works too.
  type: LoadBalancer
  loadBalancerIP: "192.168.0.243"

# M11: expose the htmx chat UI through the Cilium Ingress Controller as
# assistant.localhost (add the host via scripts/hosts-entries.sh).
ingress:
  enabled: true
  className: cilium
  host: assistant.localhost

# Read-only ClusterRole + binding for the assistant ServiceAccount. When false,
# no RBAC is created and no API token is mounted (text-only, Milestone 1 mode).
rbac:
  create: true
  # M9: permit level-2 actions (restart/scale) to execute after human
  # confirmation. Adds the write ClusterRole; off by default (least privilege).
  allowActions: false

# M9: bounds on level-2 actions.
actions:
  # Namespaces actions may target; empty = any namespace.
  allowNamespaces: ""
  # Confirmation token lifetime, seconds.
  ttlSeconds: "120"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
