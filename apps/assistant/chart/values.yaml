# Built locally (buildah) and imported into the k3s node.
image:
  repository: assistant
  tag: local
  pullPolicy: IfNotPresent

# Upstream LLM: the in-cluster llama.cpp service (apps/models/llm).
llm:
  url: http://llm.models.svc.cluster.local:8000
  model: qwen2.5-1.5b-instruct
  timeoutSeconds: "60"

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
