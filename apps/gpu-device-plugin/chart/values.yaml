# Built locally (buildah) and pushed to the in-cluster registry (config/registry/); see the Containerfile.
image:
  repository: 127.0.0.1:5000/gpu-device-plugin
  tag: local
  pullPolicy: IfNotPresent

resourceName: amd.com/render
# Host paths. The render node lives under renderPath; the plugin writes its
# kubelet socket into devicePluginDir.
renderPath: /dev/dri
devicePluginDir: /var/lib/kubelet/device-plugins

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
