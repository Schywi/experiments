apiVersion: apps/v1
kind: Deployment
metadata:
  name: regression
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "worm-regression.labels" . | nindent 4 }}
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "worm-regression.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worm-regression.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: regression
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
          startupProbe:
            httpGet: {path: /result, port: http}
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /result, port: http}
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /result, port: http}
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: regression
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "worm-regression.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "worm-regression.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 4000
      targetPort: http
