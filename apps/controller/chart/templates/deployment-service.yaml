apiVersion: apps/v1
kind: Deployment
metadata:
  name: worm-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "worm-controller.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "worm-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worm-controller.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: worm-controller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: intents
              containerPort: 8081
            - name: health
              containerPort: 8083
          env:
            - name: WORM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WORM_NAME
              value: {{ .Values.worm.name | quote }}
          startupProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: worm-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "worm-controller.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "worm-controller.selectorLabels" . | nindent 4 }}
  ports:
    - name: intents
      port: 8081
      targetPort: intents
