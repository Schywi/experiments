apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: worms.lab.experiments.io
spec:
  group: lab.experiments.io
  names:
    kind: Worm
    listKind: WormList
    plural: worms
    singular: worm
    shortNames: [worm]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [workerDeploymentName, maxReplicas]
              properties:
                workerDeploymentName:
                  type: string
                  minLength: 1
                maxReplicas:
                  type: integer
                  format: int32
                  minimum: 1
            status:
              type: object
              properties:
                desiredReplicas: {type: integer, format: int32, minimum: 0}
                currentReplicas: {type: integer, format: int32, minimum: 0}
                observedGeneration: {type: integer, format: int64, minimum: 0}
                acceptedIntentIDs:
                  type: array
                  maxItems: 1024
                  items: {type: string, minLength: 1, maxLength: 128}
