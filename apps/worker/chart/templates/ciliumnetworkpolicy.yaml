apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: worm-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "worm-worker.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "worm-worker.selectorLabels" . | nindent 6 }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            app.kubernetes.io/name: vector
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            app.kubernetes.io/name: worm-controller
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # The configured endpoints are Service DNS names, so this narrow DNS rule
    # is the only non-application egress required by the worker.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
