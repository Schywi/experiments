apiVersion: v1
kind: Service
metadata:
  name: kokoro
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kokoro.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kokoro.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
