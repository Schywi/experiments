{{- if .Values.models.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laya-models
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laya.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.models.persistence.storageClass }}
  storageClassName: {{ .Values.models.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.models.persistence.size }}
{{- end }}
