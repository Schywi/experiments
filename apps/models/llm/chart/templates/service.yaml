apiVersion: v1
kind: Service
metadata:
  name: llm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "llm.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
