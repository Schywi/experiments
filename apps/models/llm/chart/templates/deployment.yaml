apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "llm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llm.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-weights
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              dest="{{ .Values.model.dir }}/{{ .Values.model.file }}"
              if [ ! -f "$dest" ]; then
                curl -fL --retry 3 -o "$dest" \
                  "https://huggingface.co/{{ .Values.model.repo }}/resolve/main/{{ .Values.model.file }}"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: {{ .Values.model.dir }}
      containers:
        - name: llm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-m"
            - "{{ .Values.model.dir }}/{{ .Values.model.file }}"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "{{ .Values.service.port }}"
            - "-c"
            - "{{ .Values.model.contextSize }}"
            - "--threads"
            - "{{ .Values.model.threads }}"
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          # Loading the model can take a while; give the startup probe room.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: {{ .Values.model.dir }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          {{- if .Values.model.persistence.enabled }}
          persistentVolumeClaim:
            claimName: llm-models
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
